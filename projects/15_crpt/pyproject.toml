[project]
name = "crpt"
version = "0.1.0"
description = "CRPT (Честный Знак) API client — ГИС МТ, Национальный каталог, ЭДО Лайт"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
crpt = "cli.main:main"

[tool.setuptools]
packages = ["crpt", "crpt.mobile_api", "crpt.true_api", "crpt.nk_api", "crpt.web", "cli"]

[tool.setuptools.package-data]
crpt = ["web/templates/*", "web/static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
