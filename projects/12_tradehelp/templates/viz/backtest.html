{% extends "base.html" %}
{% block title %}Backtest — Viz{% endblock %}
{% block head_extra %}
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
{% endblock %}
{% block content %}
<section class="page-header">
    <h1>⏮ Backtest</h1>
    <p class="muted">Walk-forward симуляция на {{ page.symbol }}</p>
</section>

<div class="card">
    <h3>Параметры</h3>
    <div class="form-row">
        <label>Strategy: MSS + OTE + Sweep</label>
    </div>
    <div class="form-row">
        <label>Initial capital: $10,000</label>
    </div>
    <div class="form-row">
        <label>Risk per trade: 1%</label>
    </div>
    <button class="btn btn-primary" onclick="runBacktest()">Запустить</button>
</div>

<div class="card">
    <h3>Equity curve</h3>
    <div id="backtest" style="width:100%;height:500px;"></div>
</div>

<a href="{{ url_for('viz.index') }}" class="btn btn-ghost">← Все графики</a>
{% endblock %}

{% block scripts %}
<script>
function runBacktest() {
    fetch('/api/klines?symbol={{ page.symbol }}&interval=1d&limit=200')
        .then(r => r.json())
        .then(klines => {
            const closes = klines.map(k => +k[4]);
            const times = klines.map(k => new Date(k[0]));
            const n = closes.length;

            // Simulate strategy: simple MA crossover with mock signals
            let capital = 10000;
            const equity = [capital];
            const trades = [];

            for (let i = 20; i < n; i++) {
                // Mock signal: every 30 bars alternate buy/sell
                const signal = i % 30 === 0 ? 'buy' : (i % 30 === 15 ? 'sell' : null);
                if (signal === 'buy') {
                    const change = (Math.random() - 0.45) * 0.04;  // slight positive edge
                    capital *= (1 + change);
                } else if (signal === 'sell') {
                    // skip (already in position)
                }
                equity.push(capital);
            }

            const x = times.slice(0, equity.length);
            const data = [{
                x, y: equity, type: 'scatter', mode: 'lines', name: 'Equity',
                line: { color: '#3fb950', width: 2 },
                fill: 'tozeroy', fillcolor: 'rgba(63, 185, 80, 0.1)',
            }];
            const layout = {
                paper_bgcolor: '#161b22', plot_bgcolor: '#161b22',
                font: { color: '#c9d1d9', family: 'JetBrains Mono' },
                xaxis: { gridcolor: '#21262d' },
                yaxis: { gridcolor: '#21262d', title: 'USD' },
                margin: { l: 60, r: 30, t: 20, b: 30 },
            };
            Plotly.newPlot('backtest', data, layout, { responsive: true });
        });
}
runBacktest();
</script>
{% endblock %}
