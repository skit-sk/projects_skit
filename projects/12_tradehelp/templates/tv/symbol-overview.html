{% extends "base.html" %}
{% block title %}Symbol Overview — TV{% endblock %}
{% block content %}
<section class="page-header"><h1>Symbol Overview</h1></section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div class="tradingview-widget-container__widget"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
{
  "symbols": [
    ["{{ widget.symbol }}", "1D|1M|3M|6M|12M|60M|ALL"]
  ],
  "chartOnly": false,
  "width": "100%",
  "height": "{{ widget.height }}",
  "locale": "ru",
  "colorTheme": "dark",
  "autosize": true,
  "showVolume": true,
  "showMA": true,
  "hideDateRanges": false,
  "hideMarketStatus": false,
  "hideSymbolLogo": false,
  "scalePosition": "right",
  "scaleMode": "Normal",
  "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif",
  "fontSize": "10",
  "noTimeScale": false,
  "valuesTracking": "1",
  "changeMode": "price-and-percent",
  "chartType": "area",
  "maLineColor": "#2962FF",
  "maLineWidth": 1,
  "maLength": 9,
  "lineWidth": 2,
  "lineType": 0,
  "dateRanges": ["1d|1", "1m|30", "3m|60", "12m|1D", "60m|1W", "all|1M"]
}
</script>
{% endblock %}
