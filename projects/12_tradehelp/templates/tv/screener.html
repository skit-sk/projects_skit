{% extends "base.html" %}
{% block title %}Screener — TV{% endblock %}
{% block content %}
<section class="page-header"><h1>🔍 Screener</h1></section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div class="tradingview-widget-container__widget"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
{
  "width": "100%",
  "height": "{{ widget.height }}",
  "defaultColumn": "overview",
  "defaultScreen": "most_capitalized",
  "market": "crypto",
  "showToolbar": true,
  "colorTheme": "dark",
  "locale": "ru",
  "largeChartUrl": ""
}
</script>
{% endblock %}
