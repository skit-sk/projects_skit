{% extends "base.html" %}
{% block title %}Forex Heatmap — TV{% endblock %}
{% block content %}
<section class="page-header"><h1>💱 Forex Heatmap</h1></section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div class="tradingview-widget-container__widget"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-forex-heatmap.js" async>
{
  "width": "100%",
  "height": "{{ widget.height }}",
  "currencies": [
    "EUR",
    "USD",
    "JPY",
    "GBP",
    "CHF",
    "AUD",
    "CAD",
    "NZD",
    "CNY"
  ],
  "isTransparent": true,
  "colorTheme": "dark",
  "locale": "ru"
}
</script>
{% endblock %}
