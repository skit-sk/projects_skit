{% extends "base.html" %}
{% block title %}Market Overview — TV{% endblock %}
{% block content %}
<section class="page-header"><h1>🌐 Market Overview</h1></section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div class="tradingview-widget-container__widget"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "dateRange": "12M",
  "showChart": true,
  "locale": "ru",
  "width": "100%",
  "height": "{{ widget.height }}",
  "largeChartUrl": "",
  "isTransparent": true,
  "showSymbolLogo": true,
  "showFloatingTooltip": false,
  "plotLineColorGrowing": "rgba(63, 185, 80, 1)",
  "plotLineColorFalling": "rgba(248, 81, 73, 1)",
  "gridLineColor": "rgba(33, 38, 45, 1)",
  "scaleFontColor": "rgba(201, 209, 217, 1)",
  "belowLineFillColorGrowing": "rgba(63, 185, 80, 0.12)",
  "belowLineFillColorFalling": "rgba(248, 81, 73, 0.12)",
  "belowLineFillColorGrowingBottom": "rgba(63, 185, 80, 0)",
  "belowLineFillColorFallingBottom": "rgba(248, 81, 73, 0)",
  "symbolActiveColor": "rgba(88, 166, 255, 0.12)",
  "tabs": [
    {
      "title": "Crypto",
      "symbols": [
        {"s": "BINANCE:BTCUSDT", "d": "BTC"},
        {"s": "BINANCE:ETHUSDT", "d": "ETH"},
        {"s": "BINANCE:BNBUSDT", "d": "BNB"},
        {"s": "BINANCE:API3USDT", "d": "API3"},
        {"s": "BINANCE:ATOMUSDT", "d": "ATOM"}
      ],
      "originalTitle": "Crypto"
    }
  ]
}
</script>
{% endblock %}
