{% extends "base.html" %}
{% block title %}Advanced Chart — TV{% endblock %}
{% block content %}
<section class="page-header">
    <h1>📈 Advanced Chart ({{ widget.symbol }})</h1>
    <p class="muted">Полноценный TradingView с инструментами рисования, индикаторами и алертами</p>
</section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div id="tradingview_advanced" style="height:100%;width:100%"></div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script type="text/javascript">
new TradingView.widget({
    "autosize": true,
    "symbol": "{{ widget.symbol }}",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "ru",
    "toolbar_bg": "#1e222d",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "details": true,
    "hotlist": true,
    "calendar": true,
    "studies": ["MASimple@tv-basicstudies", "Volume@tv-basicstudies"],
    "container_id": "tradingview_advanced"
});
</script>
{% endblock %}
