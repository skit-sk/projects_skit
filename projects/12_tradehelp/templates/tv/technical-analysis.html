{% extends "base.html" %}
{% block title %}Technical Analysis — TV{% endblock %}
{% block content %}
<section class="page-header"><h1>📐 Technical Analysis</h1></section>

<div class="tradingview-widget-container" style="height:{{ widget.height }}px;width:100%">
    <div class="tradingview-widget-container__widget"></div>
</div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
{
  "interval": "1D",
  "width": "100%",
  "height": "{{ widget.height }}",
  "symbol": "{{ widget.symbol }}",
  "showIntervalTabs": true,
  "locale": "ru",
  "colorTheme": "dark"
}
</script>
{% endblock %}
