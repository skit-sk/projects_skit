{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — TradeHelp{% endblock %}
{% block content %}
<section class="error-page">
    <h1 class="error-code">{{ code }}</h1>
    <p class="error-message">{{ message }}</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">На главную</a>
</section>
{% endblock %}
