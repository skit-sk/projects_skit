{% extends "base.html" %}
{% block title %}Risk Calculator — Tools{% endblock %}
{% block content %}
<section class="page-header">
    <h1>💰 Risk Calculator</h1>
    <p class="muted">Kelly, fixed-fraction, ATR-based stop</p>
</section>

<div class="risk-grid">
    <div class="card">
        <h3>Входные данные</h3>
        <div class="form-row">
            <label>Account equity (USD)</label>
            <input type="number" id="equity" value="1000" step="0.01">
        </div>
        <div class="form-row">
            <label>Risk per trade (%)</label>
            <input type="number" id="risk_pct" value="1" step="0.1">
        </div>
        <div class="form-row">
            <label>Entry price</label>
            <input type="number" id="entry" value="0.2992" step="0.0001">
        </div>
        <div class="form-row">
            <label>Stop price</label>
            <input type="number" id="stop" value="0.2693" step="0.0001">
        </div>
        <div class="form-row">
            <label>Leverage</label>
            <input type="number" id="leverage" value="10" step="1">
        </div>
        <div class="form-row">
            <label>ATR(14)</label>
            <input type="number" id="atr" value="0.012" step="0.001">
        </div>
        <div class="form-row">
            <label>Win rate (%)</label>
            <input type="number" id="winrate" value="55" step="1">
        </div>
        <div class="form-row">
            <label>Reward/Risk</label>
            <input type="number" id="rr" value="2" step="0.1">
        </div>
        <button class="btn btn-primary" onclick="computeRisk()">Рассчитать</button>
    </div>

    <div class="card">
        <h3>Результат</h3>
        <div id="risk-output" class="result-grid"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/risk_calc.js') }}"></script>
<script>computeRisk();</script>
{% endblock %}
