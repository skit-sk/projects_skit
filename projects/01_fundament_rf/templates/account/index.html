{% extends "base.html" %}
{% block title %}🔐 Account — Fundament RF{% endblock %}

{% block extra_head %}
<script src="/static/vendor/idiomorph@0.3.0/idiomorph-ext.min.js"></script>
{% endblock %}

{% block content %}
<div class="account-page">
<div class="account-tabs" style="display:flex; gap:4px; margin:1rem 0; flex-wrap:wrap;">
    <button class="account-tab active"
            hx-get="/account-api/partial/overview"
            hx-target="#account-content"
            hx-swap="innerHTML"
            hx-trigger="click"
            hx-indicator="#account-loading"
            onclick="document.querySelectorAll('.account-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active');">
        📊 Overview
    </button>
    <button class="account-tab"
            hx-get="/account-api/partial/balance"
            hx-target="#account-content"
            hx-swap="innerHTML"
            hx-trigger="click"
            hx-indicator="#account-loading"
            onclick="document.querySelectorAll('.account-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active');">
        💰 Balance
    </button>
    <button class="account-tab"
            hx-get="/account-api/partial/positions"
            hx-target="#account-content"
            hx-swap="innerHTML"
            hx-trigger="click"
            hx-indicator="#account-loading"
            onclick="document.querySelectorAll('.account-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active');">
        📍 Positions
    </button>
    <button class="account-tab"
            hx-get="/account-api/partial/orders"
            hx-target="#account-content"
            hx-swap="innerHTML"
            hx-trigger="click"
            hx-indicator="#account-loading"
            onclick="document.querySelectorAll('.account-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active');">
        📋 Orders
    </button>
    <button class="account-tab"
            hx-get="/account-api/partial/fills"
            hx-target="#account-content"
            hx-swap="innerHTML"
            hx-trigger="click"
            hx-indicator="#account-loading"
            onclick="document.querySelectorAll('.account-tab').forEach(t=>t.classList.remove('active')); this.classList.add('active');">
        🔄 Fills
    </button>
</div>

<h2>
  🔐 Account
  <button onclick="syncAll()" style="background:#e67e22; border:none; font-size:12px; cursor:pointer; padding:2px 8px; border-radius:4px; color:#fff; margin-left:8px;">🔄 Sync Exchange</button>
  <button onclick="reloadFromJSON()" style="background:#3498db; border:none; font-size:12px; cursor:pointer; padding:2px 8px; border-radius:4px; color:#fff;">📂 Read JSON</button>
</h2>

<div id="positions-controls" style="display:none;">
<div id="live-flash-bar" style="display:flex; align-items:center; gap:10px; margin:0 0 0.5rem; font-size:11px; flex-wrap:wrap;">
  <label style="display:flex; align-items:center; gap:3px; cursor:pointer;">
    <input type="checkbox" id="live-toggle" onchange="toggleLive()"> 🔴 Live
  </label>
  <select id="live-interval" onchange="changeInterval()" style="font-size:11px; background:var(--input-bg); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:1px 4px;">
    <option value="1">1с</option>
    <option value="3" selected>3с</option>
    <option value="5">5с</option>
    <option value="10">10с</option>
    <option value="20">20с</option>
    <option value="30">30с</option>
    <option value="60">60с</option>
    <option value="custom">Своя</option>
  </select>
  <span id="live-status" style="color:#22c55e; font-size:11px; display:none;">⚡</span>
  <span style="color:var(--text-muted);">💡 Подсветка:</span>
  <label style="display:flex; align-items:center; gap:2px; cursor:pointer;">
    <input type="radio" name="flash-mode" value="off" onchange="setFlashMode('off')"> Выкл
  </label>
  <label style="display:flex; align-items:center; gap:2px; cursor:pointer;">
    <input type="radio" name="flash-mode" value="cells" checked onchange="setFlashMode('cells')"> ячейки
  </label>
  <label style="display:flex; align-items:center; gap:2px; cursor:pointer;">
    <input type="radio" name="flash-mode" value="rows" onchange="setFlashMode('rows')"> строки
  </label>
  <label style="display:flex; align-items:center; gap:2px; cursor:pointer;">
    <input type="radio" name="flash-mode" value="always" onchange="setFlashMode('always')"> всегда
  </label>
  <label style="display:flex; align-items:center; gap:3px; color:var(--text-muted);">
    ⏱ <input type="number" id="flash-duration-ms" value="2500" min="100" max="10000" style="width:60px" onchange="setFlashDuration(this.value)"> мс
  </label>
  <label style="display:flex; align-items:center; gap:3px; color:var(--text-muted);">
    🔆 <input type="number" id="flash-opacity" value="0.4" min="0.1" max="1" step="0.05" style="width:50px" onchange="setFlashOpacity(this.value)">
  </label>
  <div style="position:relative; margin-left:auto;">
    <button onclick="toggleColSettings()" title="Настройка колонок" style="background:none; border:1px solid var(--border-color); font-size:12px; cursor:pointer; padding:2px 6px; border-radius:4px; color:var(--text-muted);">⚙️ Колонки</button>
    <div id="col-settings" class="col-settings-float">
      <div class="col-settings-header" id="col-settings-header">
        <span>⚙️ Настройка колонок</span>
        <button onclick="closeColSettings()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:0;line-height:1;">✕</button>
      </div>
      <div id="col-list" class="col-list"></div>
    </div>
  </div>
</div>
</div>

<div id="account-loading" class="htmx-indicator" style="text-align:center; padding:2rem; display:none;">
    <span>⏳ Загрузка...</span>
</div>

<div id="account-content">
    <div style="text-align:center; padding:2rem;">⏳ Загрузка...</div>
</div>

<div id="account-footer" class="account-footer">
  <span class="footer-timing" id="footer-timing"></span>
</div>
<style>
.account-footer {
  margin-top: 1rem;
  padding: 0.4rem 0.6rem;
  border-top: 1px solid var(--border-color);
  font-size: 10px;
  color: #888;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-timing {
  font-family: monospace;
  letter-spacing: 0.3px;
}
</style>

<style>
.account-page {
    width: 100vw;
    margin-left: calc(-50vw + 50%);
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
}
#account-content {
    width: fit-content;
    min-width: 80vw;
    max-width: 100%;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.account-tab {
    padding: 8px 16px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
}
.account-tab:hover {
    background: var(--border-color);
}
.account-tab.active {
    background: #3498db;
    color: #fff;
    border-color: #3498db;
}
.account-table {
    width: fit-content;
    max-width: 100%;
    margin: 0.5rem 0;
    border-collapse: collapse;
    font-size: 12px;
}
.account-table th {
    background: var(--border-color);
    padding: 3px 6px;
    text-align: left;
    border-bottom: 2px solid var(--border-color);
    white-space: nowrap;
}
.account-table td {
    padding: 3px 6px;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
}
.account-table tr:hover {
    background: rgba(52,152,219,0.05);
}
.pl-positive { color: #22c55e; }
.pl-negative { color: #ef4444; }
.pl-achieved { color: #ca8a04; }
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 1rem 0;
}
@media (max-width: 700px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 400px) {
    .kpi-grid { grid-template-columns: 1fr; }
}
.kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 14px;
    border-left: 4px solid var(--border-color);
}
.kpi-card .kpi-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.kpi-card .kpi-value {
    font-size: 20px;
    font-weight: bold;
    margin: 4px 0;
}
.kpi-card .kpi-sub {
    font-size: 12px;
    color: #888;
}
.empty-state {
    text-align: center;
    padding: 3rem;
    color: #888;
    font-size: 14px;
}
.error-state {
    text-align: center;
    padding: 2rem;
    color: #ef4444;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    margin: 1rem 0;
}
@keyframes live-pulse {
    0%   { opacity: 1; text-shadow: 0 0 4px #22c55e; }
    30%  { opacity: 0.7; text-shadow: 0 0 14px #22c55e; }
    60%  { opacity: 1; text-shadow: 0 0 8px #22c55e; }
    100% { opacity: 1; text-shadow: 0 0 4px #22c55e; }
}
.live-pulse { animation: live-pulse 1.2s ease-out; }
.col-settings-float {
    display:none; position:fixed; z-index:1000;
    background:var(--bg-card); border:1px solid var(--border-color);
    border-radius:8px; padding:0; min-width:200px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); font-size:12px;
    top:50%; left:50%; transform:translate(-50%,-50%);
}
.col-settings-float.open { display:block; }
.col-settings-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px; cursor:grab;
    border-bottom:1px solid var(--border-color);
    font-weight:bold; font-size:13px; user-select:none;
}
.col-settings-header:active { cursor:grabbing; }
.col-list { padding:6px; }
.col-item {
    display:flex; align-items:center; gap:6px; padding:3px 6px;
    cursor:grab; font-size:12px; border-radius:4px;
    user-select:none;
}
.col-item:hover { background:var(--hover-bg, rgba(255,255,255,0.05)); }
.col-item:active { cursor:grabbing; }
.col-item.dragging { opacity:0.5; }
.col-item.drag-over { border-top:2px solid #3498db; }
.col-item .drag-handle { cursor:grab; color:var(--text-muted); font-size:14px; }
</style>

<script src="/static/vendor/htmx@1.9.11/htmx.min.js"></script>
<style id="flash-css">
@keyframes flash-bg-green {
    0%   { background-color: rgba(34,197,94,var(--flash-opacity, 0.4)); }
    100% { background-color: transparent; }
}
@keyframes flash-bg-red {
    0%   { background-color: rgba(220,38,38,var(--flash-opacity, 0.4)); }
    100% { background-color: transparent; }
}
.flash-up   { animation: flash-bg-green var(--flash-duration, 2.5s) ease-out; }
.flash-down { animation: flash-bg-red var(--flash-duration, 2.5s) ease-out; }
</style>
<script>
(function() {
    var t0 = 0;

    function saveActiveTab() {
        var active = document.querySelector('.account-tab.active');
        if (active) sessionStorage.setItem('accountTab', active.textContent.trim());
    }

    function restoreActiveTab() {
        var saved = sessionStorage.getItem('accountTab');
        if (!saved) return;
        var tabs = document.querySelectorAll('.account-tab');
        for (var i = 0; i < tabs.length; i++) {
            if (tabs[i].textContent.trim() === saved) {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                tabs[i].classList.add('active');
                sessionStorage.removeItem('accountTab');
                _loadTab(tabs[i]);
                var ctrl = document.getElementById('positions-controls');
                if (ctrl) ctrl.style.display = (saved === '📍 Positions') ? 'block' : 'none';
                return;
            }
        }
    }

    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target && evt.detail.target.id === 'account-content') {
            var acEl = document.getElementById('account-content');
            if (acEl && acEl.getAttribute('hx-get')) {
                acEl.removeAttribute('hx-get');
            }
            // Restore row order immediately (before paint)
            var savedOrder = window._savedRowOrder;
            if (savedOrder && savedOrder.length > 0) {
                var tbl = document.querySelector('.account-table');
                var tbody = tbl ? tbl.querySelector('tbody') : null;
                if (tbody) {
                    var curRows = Array.from(tbody.querySelectorAll('tr'));
                    if (curRows.length === savedOrder.length) {
                        var desiredIdx = {};
                        savedOrder.forEach(function(t, i) { desiredIdx[t] = i; });
                        curRows.sort(function(a, b) {
                            var ta = (a.cells[0] || {}).textContent || '';
                            var tb = (b.cells[0] || {}).textContent || '';
                            return (desiredIdx[ta] || 0) - (desiredIdx[tb] || 0);
                        });
                        curRows.forEach(function(r) { tbody.appendChild(r); });
                    }
                }
            }

            // ── Deferred: TG pin + flash ──
            setTimeout(function() {
                // Restore TG pin state
                var isPinned = sessionStorage.getItem('tgPinned') === 'true';
                if (isPinned) {
                    var details = document.getElementById('tg-details');
                    if (details) {
                        details.open = true;
                        var cb = document.getElementById('tg-pin');
                        if (cb) cb.checked = true;
                        var arrow = document.getElementById('tg-arrow');
                        if (arrow) arrow.textContent = '▼';
                    }
                }
                // Flash effect on positions table
            setTimeout(function() {
                function parseValue(s) {
                    if (!s) return NaN;
                    s = s.trim();
                    if (s === '—' || s === '-' || s === '') return NaN;
                    return parseFloat(s.replace(/[,\s%]/g, ''));
                }

                var mode = sessionStorage.getItem('flashMode') || 'cells';
                if (mode === 'off') return;

                var table = document.querySelector('.account-table');
                if (!table) return;

                var newSnapshot = {};
                var rows = table.querySelectorAll('tbody tr');
                rows.forEach(function(row) {
                    var cells = row.querySelectorAll('td');
                    if (cells.length < 3) return;
                    var ticker = cells[0].textContent.trim();
                    var vals = [];
                    for (var i = 0; i < cells.length; i++) {
                        vals.push(cells[i].textContent.trim());
                    }
                    newSnapshot[ticker] = vals;
                });

                    var prevSnapshot = window._tableSnapshot || {};
                var prevCount = Object.keys(prevSnapshot).length;
                console.log('FLASH: snapshot prev=' + prevCount + ' curr=' + rows.length);

                rows.forEach(function(row) {
                    var cells = row.querySelectorAll('td');
                    if (cells.length < 3) return;
                    var ticker = cells[0].textContent.trim();
                    var prev = prevSnapshot[ticker];
                    var curr = newSnapshot[ticker];

                    if (mode === 'always') {
                        var dur = getFlashDuration();
                        for (var i = 0; i < cells.length; i++) {
                            flashEl(cells[i], 'flash-up', dur);
                        }
                        return;
                    }
                    if (!prev) return;

                    if (mode === 'rows') {
                        var changed = false;
                        for (var i = 0; i < curr.length; i++) {
                            if (prev[i] !== curr[i]) { changed = true; break; }
                        }
                        if (changed) {
                            var PNL_IDX = 16;
                        var pnlPrev = parseValue(prev[PNL_IDX]) || 0;
                        var pnlCurr = parseValue(curr[PNL_IDX]) || 0;
                            var isUp = pnlCurr >= pnlPrev;
                            var dur2 = getFlashDuration();
                            for (var i = 0; i < cells.length; i++) {
                                flashEl(cells[i], isUp ? 'flash-up' : 'flash-down', dur2);
                            }
                        }
                    } else { // cells
                        for (var i = 0; i < curr.length; i++) {
                            if (prev[i] !== curr[i] && cells[i]) {
                                console.log('FLASH: cell', i, 'changed', prev[i], '→', curr[i]);
                                var a = parseValue(curr[i]), b = parseValue(prev[i]);
                                var isUp = (!isNaN(a) && !isNaN(b)) ? a >= b : curr[i] > prev[i];
                                var dur3 = getFlashDuration();
                                flashEl(cells[i], isUp ? 'flash-up' : 'flash-down', dur3);
                            }
                        }
                    }
                });
                window._tableSnapshot = newSnapshot;
            }, 50);
            });
        }
    });

    document.body.addEventListener('htmx:responseError', function(evt) {
        if (evt.detail.target && evt.detail.target.id === 'account-content') {
            setTimers('✗ ' + Math.round(performance.now() - (t0 || performance.now())) + 'ms');
        }
    });

    function _loadTab(btn) {
        if (!btn) { console.error('_loadTab: no btn, fallback to first tab'); btn = document.querySelector('.account-tab'); }
        if (!btn) { console.error('_loadTab: no tabs at all'); return; }
        var t0 = performance.now();
        var url = btn.getAttribute('hx-get');
        if (!url) return;
        htmx.ajax('GET', url, {
            target: '#account-content',
            swap: 'innerHTML',
            indicator: '#account-loading'
        });
        var ft = document.getElementById('footer-timing');
        if (ft) ft.dataset.t0 = t0;
    }

    document.body.addEventListener('htmx:afterOnLoad', function(evt) {
        if (evt.detail.target && evt.detail.target.id === 'account-content') {
            var ft = document.getElementById('footer-timing');
            if (!ft) return;
            var t0 = parseFloat(ft.dataset.t0) || performance.now();
            var total = Math.round(performance.now() - t0);
            var serverMs = evt.detail.xhr.getResponseHeader('X-Server-Ms') || '?';
            ft.textContent = '∑ ' + total + 'ms · ⚙️ ' + serverMs + 'ms';
            delete ft.dataset.t0;
        }
    });

    function reloadCurrentTab() {
        _loadTab(document.querySelector('.account-tab.active'));
    }

    window.syncAll = async function() {
        var ft = document.getElementById('footer-timing');
        if (ft) ft.textContent = '🔄 Sync...';
        var t0 = performance.now();
        try {
            var resp = await fetch('/api/sync-all', {method:'POST'});
            var syncMs = Math.round(performance.now() - t0);
            var serverMs = resp.headers.get('X-Server-Ms') || '?';
            var active = document.querySelector('.account-tab.active');
            if (active) {
                var url = active.getAttribute('hx-get');
                if (url) {
                    await new Promise(function(resolve) {
                        htmx.ajax('GET', url, {
                            target: '#account-content',
                            swap: 'innerHTML',
                            indicator: '#account-loading'
                        });
                        setTimeout(resolve, 100);
                    });
                }
            }
            var total = Math.round(performance.now() - t0);
            if (ft) ft.textContent = '∑ ' + total + 'ms · 🔄 ' + syncMs + 'ms · ⚙️ ' + serverMs + 'ms';
        } catch(e) {
            if (ft) ft.textContent = '⚠️ sync error';
        }
    };

    window.reloadFromJSON = function() {
        reloadCurrentTab();
    };

    // ── Live mode (JSON polling) ──
    var _liveTimer = null;
    var _liveStatus = document.getElementById('live-status');
    var _liveToggle = document.getElementById('live-toggle');
    var _liveInterval = document.getElementById('live-interval');
    var _liveCustom = document.getElementById('live-custom');
    var _updateCount = 0;

    function getLiveInterval() {
        if (_liveInterval.value === 'custom') return parseInt(_liveCustom.value) || 15;
        return parseInt(_liveInterval.value);
    }

    async function _liveFetch() {
        if (!_liveToggle || !_liveToggle.checked) return;
        var ft = document.getElementById('footer-timing');
        var t0 = performance.now();
        try {
            var resp = await fetch('/account-api/positions_live_data');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var data = await resp.json();
            if (!data.ok) throw new Error(data.error || 'empty response');
            var elapsed = Math.round((performance.now() - t0) * 10) / 10;
            var table = document.querySelector('.account-table');
            if (table) {
                var rows = table.querySelectorAll('tbody tr');
                for (var i = 0; i < rows.length; i++) {
                    var tickerEl = rows[i].querySelector('[data-col="0"]');
                    if (!tickerEl) continue;
                    var ticker = tickerEl.textContent.trim();
                    for (var j = 0; j < data.positions.length; j++) {
                        var p = data.positions[j];
                        if (p.ticker === ticker) {
                            var cells = {
                                '5': p.mark_price,    // Current
                                '2': p.days_open,      // Days
                                '4': p.pl_percent,     // Diff%
                                '12': p.margin_size,   // Margin
                                '13': p.bal_pct,       // Bal%
                                '16': p.unrealized_pl, // PnL $
                            };
                            for (var col in cells) {
                                var cell = rows[i].querySelector('[data-col="' + col + '"]');
                                if (cell) cell.textContent = cells[col];
                            }
                            break;
                        }
                    }
                }
            }
            _updateCount++;
            if (ft) ft.textContent = '⚡ LIVE #' + _updateCount + ' · ' + elapsed + 'ms';

            // Flash effect on live-updated cells
            var mode = sessionStorage.getItem('flashMode') || 'cells';
            if (mode !== 'off' && table) {
                var dur = getFlashDuration();
                var rows2 = table.querySelectorAll('tbody tr');
                for (var i2 = 0; i2 < rows2.length; i2++) {
                    var tickerEl2 = rows2[i2].querySelector('[data-col="0"]');
                    if (!tickerEl2) continue;
                    var ticker2 = tickerEl2.textContent.trim();
                    for (var j2 = 0; j2 < data.positions.length; j2++) {
                        var p2 = data.positions[j2];
                        if (p2.ticker === ticker2) {
                            if (mode === 'always') {
                                var allCells = rows2[i2].querySelectorAll('td');
                                for (var k = 0; k < allCells.length; k++) {
                                    flashEl(allCells[k], 'flash-up', dur);
                                }
                            } else {
                                var colMap = {'4': p2.pl_percent, '12': p2.margin_size, '13': p2.bal_pct, '16': p2.unrealized_pl};
                                for (var c in colMap) {
                                    var cell2 = rows2[i2].querySelector('[data-col="' + c + '"]');
                                    if (cell2) {
                                        var isUp = p2.unrealized_pl >= 0;
                                        flashEl(cell2, isUp ? 'flash-up' : 'flash-down', dur);
                                    }
                                }
                            }
                            break;
                        }
                    }
                }
            }
        } catch(e) {
            console.warn('_liveFetch error:', e);
            if (ft) ft.textContent = '⚠️ Live: ' + e.message;
        }
    }

    function startLiveTimer() {
        stopLiveTimer();
        var ms = getLiveInterval() * 1000;
        _liveFetch();
        _liveTimer = setInterval(_liveFetch, ms);
        _liveStatus.style.display = 'inline';
        _liveStatus.textContent = '⚡ LIVE';
        sessionStorage.setItem('liveActive', 'true');
        sessionStorage.setItem('liveInterval', getLiveInterval());
    }

    function stopLiveTimer() {
        if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
        _liveStatus.style.display = 'none';
        _liveStatus.textContent = '⚡';
        sessionStorage.setItem('liveActive', 'false');
    }

    window.toggleLive = function() {
        if (_liveToggle.checked) {
            startLiveTimer();
            _liveFetch();
        } else {
            stopLiveTimer();
            reloadCurrentTab();
        }
    };

    window.changeInterval = function() {
        if (_liveInterval.value === 'custom') {
            _liveCustom.style.display = 'inline-block';
        } else {
            _liveCustom.style.display = 'none';
            if (_liveToggle.checked) startLiveTimer();
        }
    };

    window.applyCustomInterval = function() {
        if (_liveToggle.checked) startLiveTimer();
    };

    window.setFlashMode = function(mode) {
        sessionStorage.setItem('flashMode', mode);
    };

    window.setFlashDuration = function(ms) {
        ms = parseInt(ms) || 1200;
        if (ms < 100) ms = 100;
        if (ms > 10000) ms = 10000;
        try { localStorage.setItem('flashDurationMs', String(ms)); } catch(e) {}
        document.documentElement.style.setProperty('--flash-duration', (ms / 1000) + 's');
    };

    window.setFlashOpacity = function(val) {
        val = parseFloat(val);
        if (isNaN(val)) val = 0.4;
        val = Math.max(0.1, Math.min(1, val));
        try { localStorage.setItem('flashOpacity', String(val)); } catch(e) {}
        document.documentElement.style.setProperty('--flash-opacity', val);
    };

    function getFlashDuration() {
        var saved = localStorage.getItem('flashDurationMs');
        return saved ? parseInt(saved) : 2500;
    }

    function flashEl(el, cls, dur) {
        console.log('FLASH:', cls, 'on', (el.textContent || '').trim().slice(0,20));
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
        setTimeout(function() { el.classList.remove(cls); }, dur);
    }

    function restoreFlashMode() {
        var mode = sessionStorage.getItem('flashMode') || 'cells';
        var radios = document.querySelectorAll('input[name="flash-mode"]');
        for (var i = 0; i < radios.length; i++) {
            if (radios[i].value === mode) radios[i].checked = true;
        }
    }

    function restoreFlashDuration() {
        var saved = localStorage.getItem('flashDurationMs');
        if (saved) {
            var ms = parseInt(saved) || 1200;
            var el = document.getElementById('flash-duration-ms');
            if (el) el.value = ms;
            document.documentElement.style.setProperty('--flash-duration', (ms / 1000) + 's');
        }
        var savedOp = localStorage.getItem('flashOpacity');
        if (savedOp) {
            var op = parseFloat(savedOp) || 0.4;
            var elOp = document.getElementById('flash-opacity');
            if (elOp) elOp.value = op;
            document.documentElement.style.setProperty('--flash-opacity', op);
        }
    }

    // ── Init page (safe: DOM ready guard + try/catch + fallback) ──
    function _initPage() {
        try {
            restoreFlashMode();
            restoreFlashDuration();
            if (!localStorage.getItem('flashOpacity')) {
                document.documentElement.style.setProperty('--flash-opacity', 0.4);
            }

            var ctrl = document.getElementById('positions-controls');
            var saved = sessionStorage.getItem('accountTab');
            var wasLive = sessionStorage.getItem('liveActive') === 'true';

            if (wasLive && _liveToggle) {
                _liveToggle.checked = true;
                startLiveTimer();
            }

            if (saved) {
                restoreActiveTab();
            } else {
                var firstTab = document.querySelector('.account-tab.active') || document.querySelector('.account-tab');
                if (firstTab) _loadTab(firstTab);
            }

            if (ctrl) {
                var active = document.querySelector('.account-tab.active');
                ctrl.style.display = (active && active.textContent.trim() === '📍 Positions') ? 'block' : 'none';
            }
        } catch(e) {
            console.error('initPage error:', e);
        }
    }

    // Run init when DOM is ready (handle both ready and not-ready states)
    if (document.readyState !== 'loading') {
        _initPage();
    } else {
        document.addEventListener('DOMContentLoaded', _initPage);
    }

    // Fallback: if content still placeholder after 2s, retry
    setTimeout(function() {
        var ac = document.getElementById('account-content');
        if (ac && ac.textContent.trim().includes('⏳')) {
            console.warn('fallback: content still loading, retrying...');
            var tab = document.querySelector('.account-tab.active') || document.querySelector('.account-tab');
            if (tab) _loadTab(tab);
        }
    }, 2000);

    // Override tab click — saveActiveTab + toggle controls + live
    document.querySelectorAll('.account-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            var isPositions = this.textContent.trim() === '📍 Positions';
            if (isPositions && _liveToggle && _liveToggle.checked) {
                startLiveTimer();
            } else if (!isPositions) {
                stopLiveTimer();
            }
            var ctrl = document.getElementById('positions-controls');
            if (ctrl) ctrl.style.display = isPositions ? 'block' : 'none';
            saveActiveTab();
        });
    });

    window.sortTable = function(col, restore) {
        var table = document.querySelector('.account-table');
        if (!table) return;
        var tbody = table.querySelector('tbody');
        if (!tbody) return;
        var rows = Array.from(tbody.querySelectorAll('tr'));

        var prevCol = table.getAttribute('data-sort-col');
        var prevAsc = table.getAttribute('data-sort-asc') === 'true';
        var asc = restore ? prevAsc : (prevCol == col) ? !prevAsc : true;
        table.setAttribute('data-sort-col', col);
        table.setAttribute('data-sort-asc', asc);

        rows.sort(function(a, b) {
            var va = a.querySelector('td[data-col="'+col+'"]');
            var vb = b.querySelector('td[data-col="'+col+'"]');
            if (!va || !vb) return 0;
            var ta = va.textContent.trim();
            var tb = vb.textContent.trim();
            var na = parseFloat(ta.replace(/[,\s%$]/g, ''));
            var nb = parseFloat(tb.replace(/[,\s%$]/g, ''));
            if (!isNaN(na) && !isNaN(nb)) {
                return asc ? na - nb : nb - na;
            }
            return asc ? ta.localeCompare(tb) : tb.localeCompare(ta);
        });

        var needsReorder = false;
        var currentRows = tbody.querySelectorAll('tr');
        for (var ri = 0; ri < rows.length; ri++) {
            if (rows[ri] !== currentRows[ri]) { needsReorder = true; break; }
        }
        if (needsReorder) {
            rows.forEach(function(r) { tbody.appendChild(r); });
        }
        // Update saved row order after manual sort
        var curAfter = tbody.querySelectorAll('tr');
        window._savedRowOrder = Array.from(curAfter).map(function(r) {
            return (r.querySelector('[data-col="0"]') || {}).textContent || '';
        });

        var ths = table.querySelectorAll('th.sortable');
        ths.forEach(function(th) {
            var i = parseInt(th.getAttribute('data-col'));
            th.textContent = th.textContent.replace(/ [↑↓]$/, '');
            if (i == col) th.textContent += asc ? ' ↑' : ' ↓';
        });

        try { sessionStorage.setItem('tableSort', JSON.stringify({col: col, asc: asc})); } catch(e) {}
    };

    // ── Column visibility + ordering ──
    var COL_DEFS = [
        {id:0,label:'Symbol'},{id:1,label:'Side'},{id:2,label:'Date'},
        {id:3,label:'Entry'},{id:4,label:'Diff%'},{id:5,label:'Current'},
        {id:6,label:'Days'},{id:7,label:'Last Trade'},{id:8,label:'Ord'},
        {id:9,label:'Fills'},{id:10,label:'Size (coin)'},{id:11,label:'Size (USDT)'},
        {id:12,label:'Margin'},{id:13,label:'Bal%'},{id:14,label:'Mgn%'},
        {id:15,label:'Exp%'},{id:16,label:'PnL $'},{id:17,label:'PnL %'},
        {id:18,label:'Achieved'},{id:19,label:'Fee'},{id:20,label:'SL'},
        {id:21,label:'TP'},{id:22,label:'Lev'},{id:23,label:'Liq. Price'},
        {id:24,label:'Risk'}
    ];

    function getColState() {
        try { return JSON.parse(localStorage.getItem('tableColState')); } catch(e) {}
        return null;
    }
    function saveColState(s) { localStorage.setItem('tableColState', JSON.stringify(s)); }
    function initColState() {
        var s = getColState();
        if (s) return s;
        s = {visible: COL_DEFS.map(function(c){return c.id;}), order:COL_DEFS.map(function(c){return c.id;})};
        saveColState(s);
        return s;
    }

    function toggleColSettings() {
        var p = document.getElementById('col-settings');
        p.classList.toggle('open');
        if (p.classList.contains('open')) {
            p.style.top = '';
            p.style.left = '';
            p.style.transform = 'translate(-50%, -50%)';
            renderColList();
        }
    }
    window.toggleColSettings = toggleColSettings;

    function closeColSettings() {
        document.getElementById('col-settings').classList.remove('open');
    }
    window.closeColSettings = closeColSettings;

    // Drag floating window by header
    document.addEventListener('mousedown', function(e) {
        var header = e.target.closest('#col-settings-header');
        if (!header) return;
        var panel = document.getElementById('col-settings');
        if (!panel.classList.contains('open')) return;
        e.preventDefault();
        var rect = panel.getBoundingClientRect();
        var offX = e.clientX - rect.left;
        var offY = e.clientY - rect.top;
        panel.style.transform = 'none';
        function onMove(ev) {
            panel.style.left = (ev.clientX - offX) + 'px';
            panel.style.top = (ev.clientY - offY) + 'px';
        }
        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });

    function renderColList() {
        var s = initColState();
        var list = document.getElementById('col-list');
        list.innerHTML = '';
        s.order.forEach(function(id) {
            var col = COL_DEFS.find(function(c){return c.id===id;});
            if (!col) return;
            var item = document.createElement('div');
            item.className = 'col-item';
            item.draggable = true;
            item.dataset.colId = id;
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = s.visible.indexOf(id) >= 0;
            cb.onchange = function(){ toggleCol(id); };
            var h = document.createElement('span');
            h.className = 'drag-handle';
            h.textContent = '⠿';
            var lbl = document.createTextNode(' ' + col.label);
            item.appendChild(cb);
            item.appendChild(h);
            item.appendChild(lbl);
            item.addEventListener('dragstart', onDragStart);
            item.addEventListener('dragend', onDragEnd);
            item.addEventListener('dragover', onDragOver);
            item.addEventListener('drop', onDrop);
            item.addEventListener('dragleave', onDragLeave);
            list.appendChild(item);
        });
    }

    function toggleCol(id) {
        var s = initColState();
        var idx = s.visible.indexOf(id);
        if (idx >= 0) s.visible.splice(idx, 1);
        else s.visible.push(id);
        saveColState(s);
        applyColState();
    }

    function applyColState() {
        var s = getColState();
        if (!s) return;
        document.querySelectorAll('.account-table [data-col]').forEach(function(el) {
            var col = parseInt(el.getAttribute('data-col'));
            el.style.display = s.visible.indexOf(col) >= 0 ? '' : 'none';
        });
        document.querySelectorAll('.account-table thead tr, .account-table tbody tr, .account-table tfoot tr').forEach(function(tr) {
            s.order.forEach(function(id) {
                var cell = tr.querySelector('[data-col="'+id+'"]');
                if (cell) tr.appendChild(cell);
            });
        });
    }

    function onDragStart(e) {
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }
    function onDragEnd(e) { this.classList.remove('dragging'); }
    function onDragOver(e) { e.preventDefault(); this.classList.add('drag-over'); }
    function onDragLeave(e) { this.classList.remove('drag-over'); }
    function onDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        var from = document.querySelector('.col-item.dragging');
        if (!from || from === this) return;
        var s = initColState();
        var fromId = parseInt(from.dataset.colId);
        var toId = parseInt(this.dataset.colId);
        var fi = s.order.indexOf(fromId);
        var ti = s.order.indexOf(toId);
        if (fi >= 0 && ti >= 0) {
            var _moved = s.order.splice(fi, 1)[0];
            if (fi < ti) ti--;
            s.order.splice(ti, 0, _moved);
            saveColState(s);
            renderColList();
            applyColState();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        applyColState();
        restoreFlashMode();
        restoreFlashDuration();
    });
    document.body.addEventListener('htmx:beforeSwap', function(evt) {
        if (evt.detail.target && evt.detail.target.id === 'account-content' && evt.detail.serverResponse) {
            var s = getColState();
            if (!s) return;
            var _d = document.createElement('div');
            _d.innerHTML = evt.detail.serverResponse;
            _d.querySelectorAll('.account-table thead tr, .account-table tbody tr, .account-table tfoot tr').forEach(function(tr) {
                s.order.forEach(function(id) {
                    var cell = tr.querySelector('[data-col="'+id+'"]');
                    if (cell) tr.appendChild(cell);
                });
            });
            _d.querySelectorAll('[data-col]').forEach(function(el) {
                el.style.display = s.visible.indexOf(parseInt(el.getAttribute('data-col'))) >= 0 ? '' : 'none';
            });
            // Restore sort indicator
            try {
                var _ss = JSON.parse(sessionStorage.getItem('tableSort'));
                if (_ss) {
                    _d.querySelectorAll('th.sortable').forEach(function(th) {
                        var _i = parseInt(th.getAttribute('data-col'));
                        th.textContent = th.textContent.replace(/ [↑↓]$/, '');
                        if (_i == _ss.col) th.textContent += _ss.asc ? ' ↑' : ' ↓';
                    });
                }
            } catch(e) {}
            evt.detail.serverResponse = _d.innerHTML;
        }
    });
})();
</script>
<script>
(function() {
    window.syncAll = async function() {
        var ft = document.getElementById('footer-timing');
        if (ft) ft.textContent = '🔄 Sync...';
        var t0 = performance.now();
        try {
            var resp = await fetch('/api/sync-all', {method:'POST'});
            var syncMs = Math.round(performance.now() - t0);
            var serverMs = resp.headers.get('X-Server-Ms') || '?';
            var active = document.querySelector('.account-tab.active');
            if (active) {
                var url = active.getAttribute('hx-get');
                if (url) {
                    await new Promise(function(resolve) {
                        htmx.ajax('GET', url, {target:'#account-content', swap:'innerHTML', indicator:'#account-loading'});
                        setTimeout(resolve, 100);
                    });
                }
            }
            var total = Math.round(performance.now() - t0);
            if (ft) ft.textContent = '∑ ' + total + 'ms · 🔄 ' + syncMs + 'ms · ⚙️ ' + serverMs + 'ms';
        } catch(e) {
            if (ft) ft.textContent = '⚠️ sync error';
        }
    };
    window.reloadFromJSON = function() {
        var active = document.querySelector('.account-tab.active');
        if (active) {
            var url = active.getAttribute('hx-get');
            if (url) htmx.ajax('GET', url, {target:'#account-content', swap:'innerHTML', indicator:'#account-loading'});
        }
    };
})();
</script>
</div>
