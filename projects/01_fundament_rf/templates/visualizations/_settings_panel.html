<div class="viz-tab-pane viz-settings-pane" data-tab-content="settings">
  <h2>⚙ Settings</h2>
  <p class="viz-desc">Опции отображения и параметры для каждого модуля. Сохраняются в localStorage.</p>
  <div id="viz-settings-modules"></div>
  <div class="viz-settings-buttons">
    <button id="viz-settings-apply" class="viz-btn">Apply</button>
    <button id="viz-settings-reset" class="viz-btn viz-btn-secondary">Reset</button>
    <button id="viz-settings-save"  class="viz-btn viz-btn-secondary">Save defaults</button>
  </div>
</div>
