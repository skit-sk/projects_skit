<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Line Chart</title>
    <style>
        body { margin: 0; padding: 0; background: #131722; }
        #container { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        (async function() {
            const scriptEl = document.createElement('script');
            scriptEl.src = '/static/vendor/lightweight-charts@5.2.0/lightweight-charts.standalone.production.js';
            document.head.appendChild(scriptEl);
            await new Promise((resolve, reject) => {
                scriptEl.onload = resolve;
                scriptEl.onerror = reject;
            });

            const { createChart, LineSeries } = window.LightweightCharts;

            const chart = createChart(document.getElementById('container'), {
                layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
                width: window.innerWidth,
                height: window.innerHeight,
            });

            const series = chart.addSeries(LineSeries, {
                color: '#2962FF',
                lineWidth: 2,
            });

            const klinesRes = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=100');
            const klines = await klinesRes.json();

            series.setData(klines.map(k => ({
                time: k[0] / 1000,
                value: parseFloat(k[4]),
            })));

            chart.timeScale().fitContent();

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: window.innerWidth, height: window.innerHeight });
            });
        })();
    </script>
</body>
</html>
